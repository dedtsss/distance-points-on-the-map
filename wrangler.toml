"$schema" = "./node_modules/wrangler/config-schema.json"
name = "gps-checker-map-photo"
main = "workers/host-proxy/worker.js"
compatibility_date = "2026-07-15"
account_id = "977cf45e04d4066ca0b8288de1a337ed"
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "dark-cat-crm"
database_id = "736217a0-044d-49a3-a7c1-0d55e21c17bf"

[vars]
BASIC_AUTH_USERNAME = "owner"

[[routes]]
pattern = "gps.bruce-group.net"
custom_domain = true
