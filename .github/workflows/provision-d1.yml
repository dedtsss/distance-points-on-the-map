name: Provision Dark Cat D1

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: Existing/new D1 database name
        required: true
        default: dark-cat-crm

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: ${{ inputs.database_name || 'dark-cat-crm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check credential and find or create database
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npm exec --yes wrangler@4.120.0 -- d1 list --config wrangler.toml --json > d1-list.json
          DATABASE_ID=$(node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('d1-list.json','utf8')); const row=rows.find((item)=>item.name===process.env.DATABASE_NAME); if(row) process.stdout.write(row.uuid||row.id||'');")
          if [ -n "$DATABASE_ID" ]; then
            echo "D1 database already exists: $DATABASE_NAME"
            echo "database_id=$DATABASE_ID" >> "$GITHUB_OUTPUT"
          else
            npm exec --yes wrangler@4.120.0 -- d1 create "$DATABASE_NAME" --config wrangler.toml | tee d1-create.txt
            DATABASE_ID=$(sed -n 's/.*database_id[[:space:]]*=[[:space:]]*"\([0-9a-f-]\{36\}\)".*/\1/p' d1-create.txt | head -n 1)
            test -n "$DATABASE_ID" || { echo 'D1 create succeeded but database id could not be parsed.'; exit 1; }
            echo "database_id=$DATABASE_ID" >> "$GITHUB_OUTPUT"
          fi
          echo "D1 database name: $DATABASE_NAME"
          echo "D1 database id: $DATABASE_ID"
        id: d1
