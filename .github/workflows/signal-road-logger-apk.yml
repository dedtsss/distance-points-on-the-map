name: Build Signal Road Logger APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/signal-road-logger-mvp
      - main
    paths:
      - 'signal-road-logger/**'
      - '.github/workflows/signal-road-logger-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: signal-road-logger
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalRoadLogger-debug-apk
          path: signal-road-logger/app/build/outputs/apk/debug/app-debug.apk
