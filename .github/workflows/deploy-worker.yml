name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/host-proxy/**'
      - 'wrangler.toml'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/test-worker-upload.mjs'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/test-worker-upload.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "Cloudflare API token is present."

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Check Cloudflare authentication
        run: npx wrangler whoami

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml
