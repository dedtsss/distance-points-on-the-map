name: Deploy Cloudflare Production Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/host-proxy/**'
      - 'wrangler.toml'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/test-worker-upload.mjs'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/test-worker-upload.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://gps.bruce-group.net/
    env:
      VITE_BASE_PATH: /
      VITE_UPLOAD_PROXY_URL: /api/upload
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "Cloudflare deployment secrets are present."

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build:cloudflare

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
