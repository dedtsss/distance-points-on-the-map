name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/host-proxy/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Install Wrangler
        run: npm install --no-save wrangler@3

      - name: Check Cloudflare authentication
        run: npx wrangler whoami

      - name: Deploy Worker
        run: npx wrangler deploy
