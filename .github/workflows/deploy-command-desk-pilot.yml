name: Deploy isolated Command Desk pilot

on:
  push:
    branches:
      - test/command-desk-v1-preview
    paths:
      - '.github/workflows/deploy-command-desk-pilot.yml'
      - 'wrangler.command-desk-pilot.toml'
      - 'workers/host-proxy/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'migrations/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

jobs:
  deploy-command-desk-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: dark-cat-crm-command-desk-pilot
      WORKER_NAME: dark-cat-crm-command-desk-pilot
      SOURCE_IMPLEMENTATION_SHA: 41c46dbcd8f3eb705cb70fb5f9ac5c03b6d3fbbd
      PRODUCTION_D1_ID: 736217a0-044d-49a3-a7c1-0d55e21c17bf
      WRANGLER_VERSION: 4.123.0
      VITE_BASE_PATH: /
      VITE_UPLOAD_PROXY_URL: /api/upload
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Confirm isolated deployment configuration
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test "$(git branch --show-current)" = 'test/command-desk-v1-preview'
          git merge-base --is-ancestor "$SOURCE_IMPLEMENTATION_SHA" HEAD
          test "$DATABASE_NAME" = 'dark-cat-crm-command-desk-pilot'
          test "$WORKER_NAME" = 'dark-cat-crm-command-desk-pilot'
          test "$DATABASE_NAME" != 'dark-cat-crm'
          test "$WORKER_NAME" != 'dark-cat-crm'
          test "$DATABASE_NAME" != 'dark-cat-crm-ant-pilot'
          test "$WORKER_NAME" != 'dark-cat-crm-ant-pilot'
          grep -q '^name = "dark-cat-crm-command-desk-pilot"$' wrangler.command-desk-pilot.toml
          grep -q '^database_name = "dark-cat-crm-command-desk-pilot"$' wrangler.command-desk-pilot.toml
          grep -q '^workers_dev = true$' wrangler.command-desk-pilot.toml
          ! grep -Eq '^routes?[[:space:]]*=' wrangler.command-desk-pilot.toml
          ! grep -q 'gps.bruce-group.net' wrangler.command-desk-pilot.toml
          ! grep -q 'gps-guest.bruce-group.net' wrangler.command-desk-pilot.toml
          ! grep -q "$PRODUCTION_D1_ID" wrangler.command-desk-pilot.toml
          echo "Isolation guards passed for $GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and test source head
        run: |
          npm test
          npm run build
          npm run build:cloudflare
          npm run test:preview-smoke

      - name: Create or find isolated Command Desk D1
        id: d1
        run: |
          set -euo pipefail
          npm exec --yes "wrangler@$WRANGLER_VERSION" -- d1 list --json > d1-list.json
          DATABASE_ID="$(node -e "const rows=require('./d1-list.json'); const row=rows.find((item)=>item.name===process.env.DATABASE_NAME); process.stdout.write(row ? (row.uuid || row.id || '') : '');")"
          if [ -z "$DATABASE_ID" ]; then
            npm exec --yes "wrangler@$WRANGLER_VERSION" -- d1 create "$DATABASE_NAME" > d1-create.txt
            npm exec --yes "wrangler@$WRANGLER_VERSION" -- d1 list --json > d1-list-after-create.json
            DATABASE_ID="$(node -e "const rows=require('./d1-list-after-create.json'); const row=rows.find((item)=>item.name===process.env.DATABASE_NAME); process.stdout.write(row ? (row.uuid || row.id || '') : '');")"
          fi
          test -n "$DATABASE_ID" || { echo 'Unable to obtain isolated Command Desk D1 database id.'; exit 1; }
          test "$DATABASE_ID" != "$PRODUCTION_D1_ID" || { echo 'Refusing production D1 id.'; exit 1; }
          printf 'database_id=%s\n' "$DATABASE_ID" >> "$GITHUB_OUTPUT"
          echo "Isolated D1 resolved: $DATABASE_NAME ($DATABASE_ID)"

      - name: Generate test-only config, migrate and verify D1 schema
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          sed "s/__TEST_D1_DATABASE_ID__/$DATABASE_ID/" wrangler.command-desk-pilot.toml > wrangler.command-desk-pilot.generated.toml
          grep -q "database_id = \"$DATABASE_ID\"" wrangler.command-desk-pilot.generated.toml
          ! grep -q "$PRODUCTION_D1_ID" wrangler.command-desk-pilot.generated.toml
          npm exec --yes "wrangler@$WRANGLER_VERSION" -- d1 migrations apply "$DATABASE_NAME" --remote --config wrangler.command-desk-pilot.generated.toml
          npm exec --yes "wrangler@$WRANGLER_VERSION" -- d1 execute "$DATABASE_NAME" --remote --config wrangler.command-desk-pilot.generated.toml --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('crm_sessions', 'crm_photo_items', 'crm_sequences') ORDER BY name;" | tee d1-schema.txt
          grep -q 'crm_sessions' d1-schema.txt
          grep -q 'crm_photo_items' d1-schema.txt
          grep -q 'crm_sequences' d1-schema.txt

      - name: Deploy isolated Worker to workers.dev
        id: deploy
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          sed "s/__TEST_D1_DATABASE_ID__/$DATABASE_ID/" wrangler.command-desk-pilot.toml > wrangler.command-desk-pilot.generated.toml
          npm exec --yes "wrangler@$WRANGLER_VERSION" -- deploy --config wrangler.command-desk-pilot.generated.toml | tee deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | head -n 1)"
          test -n "$WORKER_URL" || { echo 'Deployment succeeded but workers.dev URL was not found.'; exit 1; }
          case "$WORKER_URL" in https://dark-cat-crm-command-desk-pilot.*.workers.dev) ;; *) echo 'Unexpected workers.dev URL'; exit 1;; esac
          printf 'worker_url=%s\n' "$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Command Desk pilot deployed to $WORKER_URL"

      - name: Verify isolated API, desktop and mobile Command Desk
        env:
          PILOT_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          mkdir -p live-evidence
          ROOT_CODE="$(curl -sS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null -w '%{http_code}' "$PILOT_URL/")"
          case "$ROOT_CODE" in 2*) ;; *) echo "GET / failed with $ROOT_CODE"; exit 1;; esac
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 "$PILOT_URL/api/sessions" > live-evidence/sessions.json
          node -e "const p=require('./live-evidence/sessions.json'); if(!p.ok||!Array.isArray(p.sessions)||!Number.isInteger(p.nextSessionNumber)) throw new Error('unexpected D1-backed /api/sessions payload'); console.log('GET /api/sessions isolated D1 payload verified');"
          PILOT_URL="$PILOT_URL" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const steps=['Фотографии','Распознавание','Карта и точки','Очистка и загрузка','Результат'];
          const browser=await chromium.launch({headless:true});
          try {
            const desktop=await browser.newPage({viewport:{width:1440,height:900}});
            await desktop.goto(process.env.PILOT_URL,{waitUntil:'networkidle'});
            await desktop.getByRole('button',{name:'Обработка фото',exact:true}).click();
            await desktop.getByRole('heading',{name:'Command Desk'}).waitFor();
            for(const label of steps) assert.equal(await desktop.locator('.processing-stepper').getByText(label,{exact:true}).first().isVisible(),true,`desktop step missing: ${label}`);
            assert.equal(await desktop.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1),true,'desktop horizontal overflow');
            await desktop.screenshot({path:'live-evidence/desktop-command-desk-1440x900.png',fullPage:true});
            await desktop.close();

            const mobile=await browser.newPage({viewport:{width:390,height:844}});
            await mobile.goto(process.env.PILOT_URL,{waitUntil:'networkidle'});
            await mobile.getByRole('button',{name:'Открыть меню'}).click();
            await mobile.locator('.mobile-nav-drawer').getByRole('button',{name:'Обработка фото',exact:true}).click();
            await mobile.getByRole('heading',{name:'Command Desk'}).waitFor();
            const options=await mobile.locator('.processing-mobile-stepper select option').allTextContents();
            assert.deepEqual(options.map((x)=>x.replace(/ · обновить$/,'').trim()),steps,'mobile 5-step workflow mismatch');
            assert.equal(await mobile.locator('.processing-mobile-stepper').isVisible(),true,'mobile compact workflow missing');
            assert.equal(await mobile.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1),true,'390x844 horizontal overflow');
            await mobile.screenshot({path:'live-evidence/mobile-command-desk-390x844.png',fullPage:true});
            await mobile.close();
          } finally { await browser.close(); }
          console.log('Live desktop + mobile Command Desk 5-step smoke passed with no horizontal overflow.');
          NODE

      - name: Upload live pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-desk-pilot-live-evidence-${{ github.run_id }}
          path: live-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish successful pilot status and Issue checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_URL: ${{ steps.deploy.outputs.worker_url }}
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='deploy/command-desk-pilot-test' \
            -f description='Isolated Command Desk pilot deployed' \
            -f target_url="$PILOT_URL"
          cat > /tmp/pilot-checkpoint.md <<REPORT
          CHECKPOINT · AP-260821-1859 · isolated Command Desk pilot deployed

          Result: SUCCESS

          - Test branch SHA: \
          \`${GITHUB_SHA}\`
          - Source implementation SHA: \
          \`${SOURCE_IMPLEMENTATION_SHA}\`
          - Source SHA is an ancestor of test SHA: YES
          - Actions workflow: \
          \`Deploy isolated Command Desk pilot\`
          - Run ID: \
          \`${GITHUB_RUN_ID}\`
          - Run URL: ${RUN_URL}
          - Conclusion: \
          \`success\`
          - Worker: \
          \`${WORKER_NAME}\`
          - D1: \
          \`${DATABASE_NAME}\`
          - D1 id: \
          \`${DATABASE_ID}\`
          - workers.dev URL: ${PILOT_URL}

          Smoke:
          - GET / -> 2xx PASS
          - GET /api/sessions -> isolated D1-backed payload PASS
          - D1 schema -> crm_sessions / crm_photo_items / crm_sequences PASS
          - live desktop 1440x900 -> Command Desk + all 5 steps PASS
          - live mobile 390x844 -> drawer -> Обработка фото -> all 5 steps PASS
          - horizontal overflow -> absent PASS

          Production untouched: production Worker/domains/routes/D1 were not targeted; main unchanged; PR #49 not merged; no production deploy.
          REPORT
          gh issue comment 50 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pilot-checkpoint.md
