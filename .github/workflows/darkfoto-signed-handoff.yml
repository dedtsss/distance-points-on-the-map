name: DarkFoto Signed APK Handoff

on:
  pull_request:
    paths:
      - '.github/workflows/darkfoto-signed-handoff.yml'

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download permanent-signed DarkFoto 0.3.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/darkfoto-signed"
          gh release download darkfoto-v0.3.1 \
            --repo "${{ github.repository }}" \
            --pattern 'DarkFoto-0.3.1.apk' \
            --dir "$RUNNER_TEMP/darkfoto-signed"
      - uses: actions/upload-artifact@v4
        with:
          name: DarkFoto-0.3.1-signed-handoff
          path: ${{ runner.temp }}/darkfoto-signed/DarkFoto-0.3.1.apk
