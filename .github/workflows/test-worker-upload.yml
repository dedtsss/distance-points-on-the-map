name: Test Worker Upload

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: 'Cloudflare Worker URL'
        required: false
        default: 'https://gps.brus-group.net/api/upload'
      targets:
        description: 'Comma-separated targets: bundle,freeimage,ninjabox,x0'
        required: false
        default: 'bundle'
      require_mode:
        description: 'Pass mode: all or any'
        required: false
        default: 'all'

permissions:
  contents: read
  issues: write

jobs:
  test-worker-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Worker upload targets
        id: smoke
        continue-on-error: true
        env:
          WORKER_URL: ${{ github.event.inputs.worker_url || 'https://gps.brus-group.net/api/upload' }}
          WORKER_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          TARGETS: ${{ github.event.inputs.targets || 'bundle' }}
          REQUIRE_MODE: ${{ github.event.inputs.require_mode || 'all' }}
        run: |
          set +e
          node scripts/test-worker-upload.mjs 2>&1 | tee smoke-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment smoke-test result to issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('smoke-output.log') ? fs.readFileSync('smoke-output.log', 'utf8') : 'No smoke-output.log found';
            const exitCode = '${{ steps.smoke.outputs.exit_code }}' || 'unknown';
            const shortOutput = output.length > 12000 ? output.slice(0, 12000) + '\n...TRUNCATED...' : output;
            const body = `Worker upload smoke-test result\n\nCommit: ${context.sha}\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nExit code: ${exitCode}\n\n\`\`\`text\n${shortOutput}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              body,
            });

      - name: Fail workflow if smoke-test failed
        if: steps.smoke.outputs.exit_code != '0'
        run: exit 1
