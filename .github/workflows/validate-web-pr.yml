name: Validate Web Pull Request

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.js'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build Cloudflare frontend
        run: npm run build:cloudflare

      - name: Validate diff formatting
        run: git diff --check

      - name: Scan build for obvious credential literals
        run: |
          set -euo pipefail
          if rg -n --hidden --glob '!node_modules/**' --glob '!.git/**' --glob '!dist/**/*.map' \
            '(password\s*[:=]\s*["'"'][^"'"']{6,}["'"']|Authorization:\s*(Basic|Bearer)\s+[A-Za-z0-9+/=_-]{16,}|api[_-]?key\s*[:=]\s*["'"'][^"'"']+["'"'])' \
            src dist scripts; then
            echo '::error::Potential credential literal detected.'
            exit 1
          fi
          echo 'No obvious credential literals found.'
