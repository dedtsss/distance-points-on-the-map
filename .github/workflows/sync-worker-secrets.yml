name: Sync Worker Secrets

on:
  workflow_dispatch:

jobs:
  sync-worker-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALLWEBS_API_KEY: ${{ secrets.ALLWEBS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "$ALLWEBS_API_KEY" ]; then
            echo "::error::Missing GitHub secret: ALLWEBS_API_KEY"
            exit 1
          fi

          echo "Required secrets are present."

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Sync ALLWEBS_API_KEY to Cloudflare Worker
        run: printf '%s' "$ALLWEBS_API_KEY" | npx wrangler secret put ALLWEBS_API_KEY --config wrangler.toml

      - name: Verify Worker secrets
        run: npx wrangler secret list --config wrangler.toml
