name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      upload_proxy_url:
        description: 'Upload API URL for the legacy GitHub Pages build'
        required: false
        default: 'https://gps.brus-group.net/api/upload'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_UPLOAD_PROXY_URL: ${{ github.event.inputs.upload_proxy_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build legacy GitHub Pages frontend
        run: npm run build:github-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
