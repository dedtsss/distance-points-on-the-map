name: DarkFoto Android MVP

on:
  pull_request:
    paths:
      - 'darkfoto/**'
      - 'onion-drop/**'
      - 'workers/host-proxy/ninjabox.js'
      - '.github/workflows/darkfoto-android.yml'
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      VITE_NINJABOX_RELAY_URL: ${{ vars.DARKFOTO_NINJABOX_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: darkfoto/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install and test DarkFoto
        working-directory: darkfoto
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run android:sync
      - name: Test native unit verification and compile debug APK
        working-directory: darkfoto/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon -Dorg.gradle.jvmargs=-Xmx768m -Dorg.gradle.workers.max=2
      - name: Test onion-drop
        working-directory: onion-drop
        run: npm test
      - name: Build unsigned release APK
        working-directory: darkfoto/android
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify release APK is unsigned
        run: |
          if apksigner verify darkfoto/android/app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null 2>&1; then
            echo "Expected an unsigned release APK; refusing potentially pre-signed artifact."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DarkFoto-unsigned-release-apk
          path: darkfoto/android/app/build/outputs/apk/release/app-release-unsigned.apk


  deploy-ninjabox-relay:
    if: github.event_name == 'pull_request' && github.head_ref == 'manual/darkfoto-mvp-550'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: darkfoto/package-lock.json
      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy dedicated DarkFoto NinjaBox relay
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 977cf45e04d4066ca0b8288de1a337ed
          command: deploy --config darkfoto/relay/wrangler.jsonc
      - name: Show relay URL
        run: echo "DARKFOTO_RELAY_URL=${{ steps.deploy.outputs.deployment-url }}"
      - name: Live cleaned-JPEG NinjaBox smoke
        working-directory: darkfoto
        env:
          DARKFOTO_NINJABOX_RELAY_URL: ${{ steps.deploy.outputs.deployment-url }}/v1/ninjabox
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run smoke:ninjabox
