name: DarkFoto Android MVP

on:
  pull_request:
    paths:
      - 'darkfoto/**'
      - 'onion-drop/**'
      - 'workers/host-proxy/ninjabox.js'
      - '.github/workflows/darkfoto-android.yml'
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      VITE_NINJABOX_RELAY_URL: ${{ vars.DARKFOTO_NINJABOX_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: darkfoto/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install and test DarkFoto
        working-directory: darkfoto
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run build -- --mode android-test
          npx cap sync android
      - name: Test native verification and compile debug APK
        working-directory: darkfoto/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon -Dorg.gradle.jvmargs=-Xmx768m -Dorg.gradle.workers.max=2
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Emulator real-JPEG native to WebView OCR acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: cd darkfoto/android && ./gradlew :app:connectedDebugAndroidTest --no-daemon -Dorg.gradle.jvmargs=-Xmx768m -Dorg.gradle.workers.max=2
      - name: Save Android emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkFoto-Android-test-reports
          path: |
            darkfoto/android/app/build/reports/androidTests/connected/
            darkfoto/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
      - name: Restore release web assets
        working-directory: darkfoto
        run: npm run android:sync
      - name: Test onion-drop
        working-directory: onion-drop
        run: npm test
      - name: Build unsigned release APK
        working-directory: darkfoto/android
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify release APK is unsigned
        run: |
          if apksigner verify darkfoto/android/app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null 2>&1; then
            echo "Expected an unsigned release APK; refusing potentially pre-signed artifact."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DarkFoto-unsigned-release-apk
          path: darkfoto/android/app/build/outputs/apk/release/app-release-unsigned.apk

  signed-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download permanent-signed DarkFoto 0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/darkfoto-signed"
          gh release download darkfoto-v0.2.0 \
            --repo "${{ github.repository }}" \
            --pattern 'DarkFoto-0.2.0.apk' \
            --dir "$RUNNER_TEMP/darkfoto-signed"
      - uses: actions/upload-artifact@v4
        with:
          name: DarkFoto-0.2.0-signed-handoff
          path: ${{ runner.temp }}/darkfoto-signed/DarkFoto-0.2.0.apk
