name: DarkFoto Android MVP

on:
  pull_request:
    paths:
      - 'darkfoto/**'
      - 'onion-drop/**'
      - '.github/workflows/darkfoto-android.yml'
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: darkfoto/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install and test DarkFoto
        working-directory: darkfoto
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run android:sync
      - name: Test onion-drop
        working-directory: onion-drop
        run: npm test
      - name: Build debug APK
        working-directory: darkfoto/android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DarkFoto-debug-apk
          path: darkfoto/android/app/build/outputs/apk/debug/app-debug.apk
