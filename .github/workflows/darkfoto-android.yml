name: DarkFoto Android MVP

on:
  pull_request:
    paths:
      - 'darkfoto/**'
      - 'onion-drop/**'
      - '.github/workflows/darkfoto-android.yml'
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: darkfoto/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install and test DarkFoto
        working-directory: darkfoto
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run android:sync
      - name: Test onion-drop
        working-directory: onion-drop
        run: npm test
      - name: Build unsigned release APK
        working-directory: darkfoto/android
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify release APK is unsigned
        run: |
          if apksigner verify darkfoto/android/app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null 2>&1; then
            echo "Expected an unsigned release APK; refusing potentially pre-signed artifact."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DarkFoto-unsigned-release-apk
          path: darkfoto/android/app/build/outputs/apk/release/app-release-unsigned.apk

  signed-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download permanent-signed DarkFoto 0.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/darkfoto-signed"
          gh release download darkfoto-v0.1.2 \
            --repo "${{ github.repository }}" \
            --pattern 'DarkFoto-0.1.2.apk' \
            --dir "$RUNNER_TEMP/darkfoto-signed"
      - uses: actions/upload-artifact@v4
        with:
          name: DarkFoto-0.1.2-signed-handoff
          path: ${{ runner.temp }}/darkfoto-signed/DarkFoto-0.1.2.apk
