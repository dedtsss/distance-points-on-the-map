name: Android GPS Prototype APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-gps-prototype/**'
      - '.github/workflows/android-gps-prototype-apk.yml'
  pull_request:
    paths:
      - 'android-gps-prototype/**'
      - '.github/workflows/android-gps-prototype-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-gps-prototype

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGpsPrototype-debug-apk
          path: android-gps-prototype/app/build/outputs/apk/debug/app-debug.apk
