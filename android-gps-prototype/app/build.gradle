plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        debug {
            storeFile file(rootProject.file('dev-debug.keystore'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    namespace 'ru.roadgps.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.roadgps.prototype'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.4.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
